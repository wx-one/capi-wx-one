apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: WXOneCluster
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-wxone
    app.kubernetes.io/managed-by: kustomize
  name: wxonecluster-sample
spec:
  credentialsSecretRef:
    name: testcluster1
  project:
    name: default
  availabilityZone: wx_dus_1
  network:
    name: wxonecluster-sample
    subnets:
      - name: wxonecluster-sample-subnet
        ipversion: IPv4
        cidr: 10.0.0.0/24
  sshKey:
    name: wxonecluster-sample
    publicKey: 'ssh-rsa '
    projectWide: true
