apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cluster-api-provider-wxone
    cluster.x-k8s.io/provider: infrastructure-wxone
    control-plane: controller-manager-wx-one
  name: cluster-api-provider-wxone-controller-manager
  namespace: cluster-api-provider-wxone-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-api-provider-wxone
      cluster.x-k8s.io/provider: infrastructure-wxone
      control-plane: controller-manager-wx-one
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: cluster-api-provider-wxone
        cluster.x-k8s.io/provider: infrastructure-wxone
        control-plane: controller-manager-wx-one
    spec:
      containers:
        - args:
            - --metrics-bind-address=:8443
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          command:
            - /manager
          env:
            - name: WX_ONE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: cluster-api-provider-wxone-wxone-secret
            - name: WX_ONE_HOST
              valueFrom:
                configMapKeyRef:
                  key: host
                  name: cluster-api-provider-wxone-wxone-config
            - name: WX_ONE_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: username
                  name: cluster-api-provider-wxone-wxone-config
          image: registry-1.docker.io/wzrdtales/cluster-api-provider-wxone:v1.0.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp/k8s-metrics-server/metrics-certs
              name: metrics-certs
              readOnly: true
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-certs
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cluster-api-provider-wxone-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: metrics-certs
          secret:
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            optional: false
            secretName: metrics-server-cert
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cluster-api-provider-wxone
    cluster.x-k8s.io/provider: infrastructure-wxone
  name: cluster-api-provider-wxone-metrics-certs
  namespace: cluster-api-provider-wxone-system
spec:
  dnsNames:
    - cluster-api-provider-wxone-controller-manager-metrics-service.cluster-api-provider-wxone-system.svc
    - cluster-api-provider-wxone-controller-manager-metrics-service.cluster-api-provider-wxone-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: cluster-api-provider-wxone-selfsigned-issuer
  secretName: metrics-server-cert
